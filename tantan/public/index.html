<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毯毯｜地毯清潔 AI 助理</title>
<style>
/* ========== 設計代幣 ========== */
:root{
  --bg:#171717; --bg2:#222; --card:#292929; --text:#F2F0ED; --muted:#A6A29E;
  --orange:#E88745; --red:#C84B3A; --line:#3A3532; --r:14px;
  --grad:linear-gradient(135deg,#E88745,#C84B3A);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --weave:rgba(255,255,255,.025); --quote-bg:rgba(0,0,0,.25); --code:#1b1b1b; --accent-text:#E88745;
}
html[data-theme="light"]{
  --bg:#F7F4F0; --bg2:#ECE7E1; --card:#FFFFFF; --text:#2A2522; --muted:#6F6862; --line:#D8D0C7;
  --weave:rgba(0,0,0,.035); --quote-bg:rgba(0,0,0,.05); --code:#EFE9E2; --accent-text:#B8561B;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.7 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(300px,38%) 1fr;height:100dvh}

/* ========== 左：角色區（地毯織紋 + 流蘇邊） ========== */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 40px;overflow:hidden;
  background:
   radial-gradient(circle at 50% 38%,rgba(232,135,69,.22),transparent 55%),
   repeating-linear-gradient(45deg,var(--weave) 0 2px,transparent 2px 14px),
   repeating-linear-gradient(-45deg,var(--weave) 0 2px,transparent 2px 14px),
   var(--bg2)}
.stage::after{content:"";position:absolute;right:0;top:0;bottom:0;width:12px;
  background:repeating-linear-gradient(180deg,var(--orange) 0 2px,transparent 2px 7px);opacity:.55}
.portrait{width:min(300px,70%);aspect-ratio:3/4;display:grid;place-items:end center;animation:float 5s ease-in-out infinite}
.portrait svg,.portrait img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
@keyframes float{50%{transform:translateY(-8px)}}
.stage .tx{text-align:center}
.stage h1{font:700 44px/1.1 var(--serif);margin-top:18px;letter-spacing:.12em}
.sub{color:var(--accent-text);font-size:14px;letter-spacing:.08em;margin:4px 0 14px}
.intro{color:var(--muted);text-align:center;max-width:32ch;font-size:14px}
.quote{margin-top:18px;max-width:34ch;padding:10px 14px;border-left:3px solid var(--orange);background:var(--quote-bg);border-radius:0 var(--r) var(--r) 0;font:14px/1.7 var(--serif)}
.status{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#6fcf7f;box-shadow:0 0 0 0 rgba(111,207,127,.6);animation:pulse 2s infinite}
.thinking .dot{background:var(--orange);animation-duration:.8s}
.thinking .portrait{animation-duration:1.6s}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}

/* ========== 右：聊天區 ========== */
.chat{display:flex;flex-direction:column;min-width:0;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.top h2{font-size:16px;font-weight:600;flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted);transition:.15s}
.ghost:hover{border-color:var(--orange);color:var(--text)}
.ghost:active{transform:scale(.97)}
.msgs{flex:1;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:20;background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px;border:1px solid var(--orange)}
.skip:focus{left:8px}
.row{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;animation:in .25s ease-out}
.row.user{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);overflow:hidden}
.av svg,.av img{width:100%;height:100%;object-fit:cover}
.bub{padding:11px 15px;border-radius:var(--r);max-width:min(72ch,86%);word-break:break-word;line-height:1.8}
.ai .bub{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.user .bub{background:var(--grad);color:#fff;border-top-right-radius:4px;white-space:pre-wrap}
.err .bub{border-color:var(--red);background:rgba(200,75,58,.12)}
.bub p+p,.bub ul+p,.bub p+ul,.bub ol+p,.bub p+ol{margin-top:.6em}
.bub ul,.bub ol{padding-left:1.3em}
.bub strong{color:var(--accent-text)}
.bub code{background:var(--code);padding:1px 6px;border-radius:6px;font-size:.9em}
.copy{flex:none;align-self:flex-end;width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--muted);opacity:0;transition:.15s;display:grid;place-items:center}
.row:hover .copy,.copy:focus-visible{opacity:1}
.copy:hover{background:var(--card);color:var(--text)}
.copy.ok{color:#6fcf7f;opacity:1}
@media(hover:none){.copy{opacity:.6}}
.typing i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--orange);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:760px;width:100%;margin:0 auto;padding-left:46px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;transition:.15s}
.chip:hover{border-color:var(--orange);background:rgba(232,135,69,.1)}
.composer{padding:12px 22px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.box{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px;transition:.15s}
.box:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,135,69,.15)}
textarea{flex:1;resize:none;overflow-y:hidden;background:none;border:0;color:var(--text);font:inherit;max-height:140px;padding:6px 0;outline:none}
textarea:focus-visible{outline:none}
textarea::placeholder{color:#7d7873}
.send{border:0;border-radius:12px;padding:9px 18px;background:var(--grad);color:#fff;font-weight:600;transition:.15s}
.send:hover{filter:brightness(1.1)}.send:active{transform:scale(.97)}
.send:disabled{opacity:.4;cursor:not-allowed;filter:none}
.hint{max-width:760px;margin:6px auto 0;font-size:12px;color:#7d7873;text-align:center}

/* ========== 設定視窗 ========== */
dialog{margin:auto;width:min(560px,92vw);max-height:90dvh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:22px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{font:600 18px var(--serif);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.warn{border-left:3px solid var(--red);padding:6px 10px;background:rgba(200,75,58,.1);border-radius:0 8px 8px 0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:8px 10px}
dialog textarea{max-height:none;min-height:90px;resize:vertical}
.x{float:right;position:sticky;top:0;margin:-8px -8px 0 0;width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--muted);font-size:22px;line-height:1}
.x:hover{background:var(--bg);color:var(--text)}
.danger{margin-left:auto;background:var(--red);border:0;border-radius:10px;padding:8px 14px;color:#fff;font-size:13px;transition:.15s}
.danger:hover{filter:brightness(1.1)}.danger:active{transform:scale(.97)}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .send{padding:8px 16px}
#testOut{font-size:13px;margin-top:10px;white-space:pre-wrap}

/* ========== 手機橫放（矮螢幕）：收起角色簡介，把空間留給聊天 ========== */
@media(max-height:500px){.intro,.quote{display:none}.portrait{width:min(120px,40%)}.stage h1{font-size:30px;margin-top:8px}.stage{padding:12px 20px}}
/* ========== 觸控裝置：加大點擊範圍 ========== */
@media(pointer:coarse){.chip{padding:11px 16px}.ghost{padding:10px 14px}.copy,.x{width:40px;height:40px}.send{padding:12px 20px}}
/* ========== 手機／平板：角色區縮成橫條 ========== */
@media(max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .stage{flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 16px;text-align:left}
  .stage::after{top:auto;left:0;right:0;bottom:0;width:auto;height:6px;background:repeating-linear-gradient(90deg,var(--orange) 0 2px,transparent 2px 7px)}
  .portrait{width:56px;height:56px;aspect-ratio:1;flex:none;border-radius:50%;overflow:hidden;animation:none;background:var(--card)}
  .portrait svg,.portrait img{object-fit:cover;object-position:50% 12%;filter:none}
  .stage h1{font-size:22px;margin:0}.sub{margin:0;font-size:12px}
  .intro,.quote{display:none}.status{margin:0 0 0 auto}
  .stage .tx{display:flex;flex-direction:column;text-align:left}
  .chat{height:auto;min-height:0}
  .msgs,.composer,.top{padding-left:14px;padding-right:14px}
  .chips{padding-left:0}
  .hint{display:none}
  textarea,input,select,dialog textarea{font-size:16px}  /* 避免 iOS 點進輸入框時自動放大畫面 */
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<!-- 預設角色插畫（內建 SVG）。想換成自己的圖：在下方 CONFIG.characterImage 填圖片網址即可 -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="face" viewBox="0 0 200 200">
    <path d="M52 96c0-40 22-62 48-62s48 22 48 62z" fill="#C84B3A"/>
    <path d="M44 96h112v10c0 6-4 10-10 10H54c-6 0-10-4-10-10z" fill="#E88745"/>
    <rect x="62" y="70" width="76" height="22" rx="11" fill="#171717"/>
    <circle cx="82" cy="81" r="7" fill="#9fd8e8"/><circle cx="118" cy="81" r="7" fill="#9fd8e8"/>
    <path d="M58 112c0 30 18 48 42 48s42-18 42-48z" fill="#F1C9A5"/>
    <circle cx="84" cy="130" r="4" fill="#2a211c"/><circle cx="116" cy="130" r="4" fill="#2a211c"/>
    <path d="M90 144q10 8 20 0" stroke="#8a4b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="141" r="6" fill="#E88745" opacity=".35"/><circle cx="126" cy="141" r="6" fill="#E88745" opacity=".35"/>
  </symbol>
</svg>

<a class="skip" href="#input">跳到輸入框</a>
<div class="sr" id="live" aria-live="polite"></div>
<div class="app" id="app">
  <!-- 左：角色展示區 -->
  <aside class="stage">
    <div class="portrait" id="portrait"></div>
    <div class="tx"><h1>毯毯</h1><div class="sub">Carpet Care Assistant</div></div>
    <p class="intro">熟悉洗地毯的每一道工序：從除塵、污漬辨識到黑光燈驗收，陪你把髒毯子洗回原本的花紋。</p>
    <p class="quote">先別急著刷，讓我看看污漬的狀態。我們一步一步處理，才不會把地毯越洗越糟。</p>
    <div class="status"><span class="dot"></span><span id="statusTx">線上服務中</span></div>
  </aside>

  <!-- 右：聊天區 -->
  <main class="chat">
    <header class="top">
      <h2>毯毯｜地毯清潔 AI 助理</h2>
      <button class="ghost" id="clearBtn">清除對話</button>
      <button class="ghost" id="themeTop"></button>
      <button class="ghost" id="setBtn">設定</button>
    </header>
    <div class="msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions" aria-label="對話記錄"></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="描述污漬或遇到的問題…" aria-label="輸入訊息" aria-describedby="hint"></textarea>
        <button class="send" id="sendBtn">送出</button>
      </div>
      <div class="hint" id="hint">Enter 送出，Shift + Enter 換行</div>
    </div>
  </main>
</div>

<!-- 設定視窗 -->
<dialog id="dlg" aria-labelledby="dlgTitle">
  <button class="x" id="closeBtn" aria-label="關閉">×</button>
  <h3 id="dlgTitle">API 設定</h3>
  <p class="note warn">純前端 HTML 的 API Key 容易被使用者取得。僅限自己本機使用；正式上線請改用後端 Proxy 或安全的 API Gateway，不要把金鑰寫進公開檔案。</p>
  <label>外觀</label>
  <button class="ghost" id="themeBtn"></button>
  <label for="cProvider">服務類型</label>
  <select id="cProvider">
    <option value="proxy">線上中轉（預設，不需金鑰）</option>
    <option value="chatpdf">ChatPDF 直連（以 PDF 為知識庫）</option>
    <option value="openai">OpenAI 相容 API（Chat Completions）</option>
  </select>
  <div id="boxChatpdf">
    <label for="cPdfKey">ChatPDF API Key</label><input id="cPdfKey" type="password" autocomplete="off" placeholder="sec_...">
    <label for="cBase">API 位址（被 CORS 擋住時，改填你的中轉網址，結尾含 /v1）</label><input id="cBase" placeholder="https://api.chatpdf.com/v1">
    <label for="cSource">Source ID</label><input id="cSource" placeholder="src_xxxxxx 或 cha_xxxxxx">
    <label for="cFile">還沒有 Source ID？上傳攻略 PDF 取得</label><input id="cFile" type="file" accept="application/pdf">
  </div>
  <div id="boxOpenai" hidden>
    <label for="cEndpoint">API Endpoint</label><input id="cEndpoint" placeholder="https://你的服務/v1/chat/completions">
    <label for="cKey">API Key</label><input id="cKey" type="password" autocomplete="off">
    <label for="cModel">Model</label><input id="cModel" placeholder="模型名稱">
    <label for="cKb">知識庫文字（選填，會附加在 System Prompt 後）</label><textarea id="cKb" placeholder="貼上攻略內容，讓模型依此回答"></textarea>
  </div>
  <label for="cSys">System Prompt（OpenAI 模式使用）</label><textarea id="cSys" style="min-height:160px"></textarea>
  <div class="acts">
    <button class="send" id="saveBtn">儲存</button>
    <button class="ghost" id="testBtn">連線測試</button>
    <button class="danger" id="resetBtn">還原預設</button>
  </div>
  <div id="testOut"></div>
</dialog>

<script>
/* =========================================================
 * 1. 設定區（CONFIG）— 要換 API、金鑰、模型、角色圖，改這裡
 * ---------------------------------------------------------
 * 安全提醒：純前端 HTML 的 API Key 任何人都能從瀏覽器取得。
 * 請勿把正式金鑰寫死在公開部署的檔案中；正式上線請透過
 * 後端 Proxy 或 API Gateway。此處預設留空，由「設定」視窗
 * 填入，並只存在使用者自己的瀏覽器 localStorage。
 * ========================================================= */
// 以「檔案」方式開啟（file://）時，沒有網站網域可用，請填你部署後的網址，例如 "https://tantan.pages.dev"
// 部署在網站上時不需要填（網頁會自動呼叫同一個網站的 /v1，金鑰只存在伺服器端）
const PROXY_ORIGIN = "";

const DEFAULT_CONFIG = {
  provider: "proxy",                   // "proxy"（線上中轉，預設）、"chatpdf"（直連）或 "openai"
  characterImage: "",                  // 角色圖片網址或相對路徑，例如 "tantan.png"；留空則使用內建插畫
  chatpdf: { apiKey: "", sourceId: "", base: "https://api.chatpdf.com/v1" },
  openai:  { endpoint: "", apiKey: "", model: "", knowledge: "" },
  maxHistory: 6,                       // ChatPDF 最多 6 則訊息
  systemPrompt:
`你是「毯毯」，專門協助玩家攻略《洗地毯》（まっくろじゅうたん洗い屋）的地毯清潔職人。

【個性】冷靜、細心、務實、有耐心。有專業感但不賣弄；說話自然親切，不像制式客服。玩家操作失誤時，說明原因與改善方式，不責備。給具體操作建議，而不是只講原理。
【口頭禪】「先別急著刷，讓我看看污漬的狀態。我們一步一步處理，才不會把地毯越洗越糟。」（偶爾使用，不要每次都說）

【回答原則】
1. 優先依據提供的遊戲知識庫回答。
2. 區分「遊戲明確提示」與「根據資料整理的推論」。
3. 不可捏造遊戲沒有提供的藥劑配方、隱藏數值或評分機制。
4. 知識庫沒有答案時，坦白說目前遊戲提示沒有明確說明。
5. 用自然口語回答，像耐心的前輩在聊天：先回應玩家的狀況，再把做法與原因順著說出來；不要用「工具／操作／判斷依據／下一步」之類的標題或制式條列，步驟多時才用簡短清單。語氣溫和，用建議代替命令。
6. 玩家資訊不足時，先只問最重要的一個問題（材質未知就提醒別用強藥劑、硬毛刷、大量溫水；污漬未知就請對方用放大鏡觀察線索）。
7. 不宣稱能讀取遊戲畫面或即時數值，除非玩家自己提供。
請使用繁體中文，簡潔、可直接執行。`,
  // ChatPDF 沒有 system prompt 欄位，改為把這段精簡人設附在最新一則提問前
  chatpdfPersona:
    "（你是地毯清潔職人「毯毯」，像耐心的前輩在跟朋友聊天。用自然口語、短短幾段回答：先回應玩家的狀況，再把做法和原因順著說出來。不要列「工具／操作／判斷依據／下一步」這類標題，也不要制式條列；語氣溫和，用建議代替命令，不責備。只依文件內容回答，文件沒寫就坦白說遊戲提示沒有明確說明，不要編造配方或數值。資訊不足時只問一個最重要的問題。請用繁體中文。）\n玩家問題：",
  welcome: "嗨！我是毯毯。地毯上有什麼難處理的污漬嗎？不論是工具選擇、材質判斷，還是清洗流程，我都可以陪你一步一步處理。",
  quick: ["不同地毯材質該怎麼清洗？","黑光燈照到發光的地方怎麼辦？","為什麼抽洗機吸不乾淨？","如何提升顧客驗收評價？"]
};

const STORE_KEY = "tantan_config_v2";
let CONFIG = loadConfig();

function loadConfig(){
  const c = structuredClone(DEFAULT_CONFIG);
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    Object.assign(c.chatpdf, s.chatpdf); Object.assign(c.openai, s.openai);
    if(s.provider) c.provider = s.provider;
    if(s.systemPrompt) c.systemPrompt = s.systemPrompt;
  }catch(e){}
  return c;
}
function saveConfig(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({
    provider:CONFIG.provider, chatpdf:CONFIG.chatpdf, openai:CONFIG.openai, systemPrompt:CONFIG.systemPrompt })); }catch(e){}
}

/* =========================================================
 * 2. API 層 — 與介面完全分離。對外只有 askAI(history)
 * history = [{role:"user"|"assistant", content:"..."}]
 * ========================================================= */
class ApiError extends Error{ constructor(kind,msg){ super(msg); this.kind=kind; } }

async function http(url, opts){
  let res;
  try{ res = await fetch(url, opts); }
  catch(e){ throw new ApiError("network","無法連線到 API（網路問題，或該服務不允許從瀏覽器直接呼叫 / CORS）。"); }
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    if(res.status===401||res.status===403) throw new ApiError("auth","API Key 無效或沒有權限，請到設定檢查。");
    if(res.status===429) throw new ApiError("rate","請求太頻繁或額度用完，稍等一下再試。");
    throw new ApiError("http",`API 回應錯誤（${res.status}）。${t.slice(0,120)}`);
  }
  return res.json();
}

async function askAI(history){
  if(CONFIG.provider==="chatpdf") return askChatPdf(history);
  if(CONFIG.provider==="openai") return askOpenAI(history);
  return askProxy(history);
}

// 線上中轉：網頁不帶任何金鑰與 Source ID，由伺服器端（_worker.js）補上
function proxyBase(){
  if(location.protocol.startsWith("http")) return location.origin + "/v1";
  if(!PROXY_ORIGIN) throw new ApiError("config","以檔案開啟時，需要先在程式碼最上方填入 PROXY_ORIGIN（你的線上網址）。");
  return PROXY_ORIGIN.replace(/\/+$/,"") + "/v1";
}
async function askProxy(history){
  const msgs = history.slice(-CONFIG.maxHistory).map(m=>({...m}));
  msgs[msgs.length-1].content = CONFIG.chatpdfPersona + msgs[msgs.length-1].content;
  const data = await http(proxyBase()+"/chats/message",{
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:msgs})
  });
  return (data.content||"").replace(/\s?\[P\d+\]/g,"");
}

async function askChatPdf(history){
  const {apiKey,sourceId,base} = CONFIG.chatpdf;
  if(!apiKey || !sourceId) throw new ApiError("config","請先在「設定」填入 ChatPDF API Key 與 Source ID。");
  // 無狀態：每次帶最近 N 則；最新一則提問前附上精簡人設
  const msgs = history.slice(-CONFIG.maxHistory).map(m=>({...m}));
  msgs[msgs.length-1].content = CONFIG.chatpdfPersona + msgs[msgs.length-1].content;
  const data = await http(base+"/chats/message",{
    method:"POST",
    headers:{"x-api-key":apiKey,"Content-Type":"application/json"},
    body:JSON.stringify({sourceId, messages:msgs})
  });
  return (data.content||"").replace(/\s?\[P\d+\]/g,"");
}

async function askOpenAI(history){
  const {endpoint,apiKey,model,knowledge} = CONFIG.openai;
  if(!endpoint || !model) throw new ApiError("config","請先在「設定」填入 API Endpoint 與 Model。");
  const sys = CONFIG.systemPrompt + (knowledge ? "\n\n【遊戲知識庫】\n"+knowledge : "");
  const data = await http(endpoint,{
    method:"POST",
    headers:{"Content-Type":"application/json", ...(apiKey?{Authorization:"Bearer "+apiKey}:{})},
    body:JSON.stringify({model, messages:[{role:"system",content:sys}, ...history.slice(-20)]})
  });
  const out = data?.choices?.[0]?.message?.content;
  if(!out) throw new ApiError("http","API 回傳格式不符預期（找不到 choices[0].message.content）。");
  return out;
}

async function uploadPdf(file){
  const {apiKey,base} = CONFIG.chatpdf;
  if(!apiKey) throw new ApiError("config","請先填入 ChatPDF API Key。");
  const fd = new FormData(); fd.append("file", file);
  const data = await http(base+"/sources/add-file",{method:"POST",headers:{"x-api-key":apiKey},body:fd});
  return data.sourceId;
}

/* =========================================================
 * 3. 介面層
 * ========================================================= */
const $ = id => document.getElementById(id);
const msgsEl=$("msgs"), input=$("input"), sendBtn=$("sendBtn");
let history = [], busy = false;

const avatarHTML = () => CONFIG.characterImage
  ? `<img src="${CONFIG.characterImage}" alt="">`
  : `<svg viewBox="0 0 200 200" aria-hidden="true"><use href="#face"/></svg>`;

function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// 精簡 Markdown：粗體、行內碼、清單、段落
function md(src){
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for(const line of src.split("\n")){
    let m;
    if((m=line.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){close();out.push("<ul>");list="ul";} out.push(`<li>${inline(m[1])}</li>`); }
    else if((m=line.match(/^\s*\d+[.、)]\s+(.*)/))){ if(list!=="ol"){close();out.push("<ol>");list="ol";} out.push(`<li>${inline(m[1])}</li>`); }
    else if(line.trim()===""){ close(); }
    else { close(); out.push(`<p>${inline(line.replace(/^#+\s*/,""))}</p>`); }
  }
  close(); return out.join("");
}

const ICON_COPY='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_OK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
async function copyText(t, btn){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){   // 本機檔案或舊瀏覽器的備援做法
    const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove();
  }
  btn.innerHTML=ICON_OK; btn.classList.add("ok"); $("live").textContent="已複製";
  setTimeout(()=>{ $("live").textContent=""; btn.innerHTML=ICON_COPY; btn.classList.remove("ok"); },1400);
}
function addMsg(role, text, extraClass=""){
  const row=document.createElement("div");
  row.className=`row ${role==="user"?"user":"ai"} ${extraClass}`;
  const body = role==="user" ? esc(text) : md(text);
  const btn = text ? `<button class="copy" title="複製" aria-label="複製這則訊息">${ICON_COPY}</button>` : "";
  const who = text ? `<span class="sr">${role==="user"?"你說：":"毯毯說："}</span>` : "";
  row.innerHTML = role==="user" ? `${btn}<div class="bub">${who}${body}</div>`
    : `<div class="av">${avatarHTML()}</div><div class="bub">${who}${body}</div>${btn}`;
  if(extraClass==="err") row.setAttribute("role","alert");
  if(text) row.querySelector(".copy").onclick = e => copyText(text, e.currentTarget);
  msgsEl.appendChild(row); scrollDown(); return row;
}
const scrollDown = () => { msgsEl.scrollTop = msgsEl.scrollHeight; };

function setThinking(on){
  busy=on; sendBtn.disabled=on;
  $("app").classList.toggle("thinking",on);
  $("statusTx").textContent = on ? "思考中…" : "線上服務中";
}

function renderStart(){
  history=[]; msgsEl.innerHTML="";
  addMsg("ai", CONFIG.welcome);
  const chips=document.createElement("div"); chips.className="chips"; chips.id="chips";
  CONFIG.quick.forEach(q=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=q;
    b.onclick=()=>send(q); chips.appendChild(b);
  });
  msgsEl.appendChild(chips);
}

async function send(text){
  text=(text||"").trim();
  if(!text||busy) return;
  $("chips")?.remove();
  addMsg("user",text); history.push({role:"user",content:text});
  input.value=""; fitInput();
  setThinking(true);
  const typing=addMsg("ai",""); typing.querySelector(".bub").innerHTML='<span class="typing"><i></i><i></i><i></i></span> 毯毯正在思考……';
  try{
    const reply = await askAI(history);
    typing.remove();
    if(!reply.trim()) throw new ApiError("http","API 沒有回傳內容。");
    history.push({role:"assistant",content:reply}); addMsg("ai",reply);
  }catch(e){
    typing.remove(); history.pop();   // 失敗的提問不留在歷史，方便重試
    addMsg("ai","這次沒有順利送出：\n"+(e.message||"發生未知錯誤")+"\n你的設定與對話都還在，修正後再試一次就好。","err");
  }finally{ setThinking(false); input.focus(); }
}

function fitInput(){
  input.style.height="auto";
  const h=input.scrollHeight;
  input.style.height=Math.min(h,140)+"px";
  input.style.overflowY = h>140 ? "auto" : "hidden";   // 只有超過上限才出現捲動條
}

sendBtn.onclick=()=>send(input.value);
input.addEventListener("input",fitInput);
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(input.value); }
});
$("clearBtn").onclick=()=>{ if(!busy && confirm("要清除目前的對話並重新開始嗎？")) renderStart(); };

/* ---------- 設定視窗 ---------- */
const dlg=$("dlg");
function fillForm(){
  $("cProvider").value=CONFIG.provider;
  $("cPdfKey").value=CONFIG.chatpdf.apiKey; $("cSource").value=CONFIG.chatpdf.sourceId; $("cBase").value=CONFIG.chatpdf.base;
  $("cEndpoint").value=CONFIG.openai.endpoint; $("cKey").value=CONFIG.openai.apiKey;
  $("cModel").value=CONFIG.openai.model; $("cKb").value=CONFIG.openai.knowledge;
  $("cSys").value=CONFIG.systemPrompt; toggleProvider();
}
function toggleProvider(){
  const p=$("cProvider").value;
  $("boxChatpdf").hidden = p!=="chatpdf"; $("boxOpenai").hidden = p!=="openai";
}
function readForm(){
  CONFIG.provider=$("cProvider").value;
  CONFIG.chatpdf.apiKey=$("cPdfKey").value.trim();
  CONFIG.chatpdf.sourceId=$("cSource").value.trim();
  CONFIG.chatpdf.base=($("cBase").value.trim()||DEFAULT_CONFIG.chatpdf.base).replace(/\/+$/,"");
  CONFIG.openai.endpoint=$("cEndpoint").value.trim(); CONFIG.openai.apiKey=$("cKey").value.trim();
  CONFIG.openai.model=$("cModel").value.trim(); CONFIG.openai.knowledge=$("cKb").value;
  CONFIG.systemPrompt=$("cSys").value.trim()||DEFAULT_CONFIG.systemPrompt;
}
$("setBtn").onclick=()=>{ fillForm(); $("testOut").textContent=""; dlg.showModal(); };
$("closeBtn").onclick=()=>dlg.close();
// 點視窗外的空白處（遮罩）也會關閉
dlg.addEventListener("click",e=>{
  const r=dlg.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) dlg.close();
});
// 深色 / 淺色模式
const THEME_KEY="tantan_theme";
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $("themeTop").textContent = t==="light" ? "深色模式" : "淺色模式";
  $("themeBtn").textContent = t==="light" ? "目前：淺色（點此切換為深色）" : "目前：深色（點此切換為淺色）";
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
}
const flipTheme=()=>applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
$("themeBtn").onclick=flipTheme; $("themeTop").onclick=flipTheme;
// 一般訪客看不到 API 設定；開發時網址加 ?dev 才顯示
if(!new URLSearchParams(location.search).has("dev")) $("setBtn").hidden=true;
let savedTheme="dark"; try{savedTheme=localStorage.getItem(THEME_KEY)||"dark";}catch(e){}
applyTheme(savedTheme);
$("cProvider").onchange=toggleProvider;
$("saveBtn").onclick=()=>{ readForm(); saveConfig(); $("testOut").textContent="已儲存。"; };
$("resetBtn").onclick=()=>{ if(confirm("還原為預設設定？")){ try{localStorage.removeItem(STORE_KEY);}catch(e){} CONFIG=loadConfig(); fillForm(); } };
$("testBtn").onclick=async()=>{
  readForm(); const out=$("testOut"); out.textContent="測試中…";
  try{ const r=await askAI([{role:"user",content:"你好，請用一句話自我介紹。"}]); out.textContent="連線成功：\n"+r; }
  catch(e){ out.textContent="連線失敗：\n"+e.message; }
};
$("cFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  readForm(); const out=$("testOut"); out.textContent="上傳中…";
  try{ const id=await uploadPdf(f); $("cSource").value=id; CONFIG.chatpdf.sourceId=id; saveConfig(); out.textContent="上傳成功，Source ID 已填入並儲存："+id; }
  catch(err){ out.textContent="上傳失敗：\n"+err.message+"\n（也可以到 chatpdf.com 手動上傳，再把網址中的 ID 加上 cha_ 前綴貼進來）"; }
};

/* ---------- 啟動 ---------- */
$("portrait").innerHTML = CONFIG.characterImage
  ? `<img src="${CONFIG.characterImage}" alt="毯毯">`
  : `<svg viewBox="0 0 200 260" role="img" aria-label="毯毯">
      <path d="M52 250c0-62 20-98 48-98s48 36 48 98z" fill="#E88745"/>
      <path d="M72 250v-58h56v58z" fill="#C84B3A"/>
      <rect x="84" y="206" width="32" height="22" rx="4" fill="#171717" opacity=".35"/>
      <path d="M150 190l30-46" stroke="#A6A29E" stroke-width="6" stroke-linecap="round"/>
      <rect x="164" y="124" width="30" height="16" rx="5" transform="rotate(-33 179 132)" fill="#F2F0ED"/>
      <circle cx="176" cy="112" r="6" fill="#9fd8e8" opacity=".8"/><circle cx="190" cy="98" r="4" fill="#9fd8e8" opacity=".6"/>
      <g transform="translate(0,6) scale(1) translate(0,-14)"><svg x="0" y="0" width="200" height="200" viewBox="0 0 200 200"><use href="#face"/></svg></g>
    </svg>`;
renderStart(); fitInput();
